name: Validation report
description: You installed a firmware on a real FM-1, played it and reverted to stock. Report it to earn (or update) its octopus.
title: "Validation: <firmware> <version>"
labels: ["validation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! A validation is a hands-on session on a real FM-1: **install → play → Sound check → revert to stock V15**.
        The full procedure is in [VALIDATION.md](../blob/main/VALIDATION.md). A maintainer (or you, in a pull request) turns this report
        into a record in `firmware/validated.json` with `tools/fm1_validate.py`.

        **Everything here is public.** Leave out serial numbers, USB instance IDs, local file paths and email addresses.
  - type: dropdown
    id: firmware
    attributes:
      label: Firmware
      description: The catalog id. Not listed? Pick "other" and name it below.
      options: [official, fm1open, felucca, sloop, x0x, melodee, choralroot, fomni, ghoulbox, amb1, jangada, skiff, fm1va, aprilos, other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Exactly as the release names it.
      placeholder: v1.6.1
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File you flashed
      placeholder: felucca-1.6.1.fwsc
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA256 of that file
      description: "Windows: `certutil -hashfile FILE SHA256` · macOS/Linux: `shasum -a 256 FILE`. Octo-Vave shows it under More on the card for files in its library."
      placeholder: 64 hex digits
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - "clean (orange): install, play and revert all worked"
        - "issues (purple): all three done, but something needed a workaround"
        - "failed (red): a step failed"
    validations:
      required: true
  - type: checkboxes
    id: steps
    attributes:
      label: Steps completed
      options:
        - label: Installed with the project's installer
        - label: Ran and played it (screen, keys, knobs, sound)
        - label: Reverted to stock V15 and stock works again
  - type: textarea
    id: checks
    attributes:
      label: What you checked
      description: Sound check results (which steps you heard), MIDI port name, anything you tried.
      placeholder: "Generic sound check: heard 1-4, 8, 10; not heard 6, 7. MIDI port 'Felucca'. Stock Run all tests 8/8 after revert."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Required for issues or failed results — what went wrong, and the workaround if there was one.
  - type: input
    id: stock
    attributes:
      label: Stock firmware before installing
      description: The version you started from (shown at boot or in M-UPGRADE).
      placeholder: V15
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report has no serial numbers, USB instance IDs, local paths or email addresses.
          required: true
