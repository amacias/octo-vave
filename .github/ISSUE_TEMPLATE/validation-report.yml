name: Validation report
description: You installed a firmware on a real FM-1, played it and reverted to stock. Report it to earn (or update) its octopus.
title: "Validation: <firmware> <version>"
labels: ["validation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! A validation is a hands-on session on a real FM-1: **install from stock → play → Sound check → revert to the same stock** (V15, the baseline, or V16).
        The full procedure is in [VALIDATION.md](../blob/main/VALIDATION.md). Once a maintainer accepts the report, a workflow checks
        the file against the release and prepares the record for `firmware/validated.json`; the maintainer reviews and merges it.
        Reports are accepted for M-VAVE's own firmware (stock and official) and for firmware on the **top 30 leaderboard** (the homepage ranking).

        **From Octo-Vave:** *Submit* on a manual validation fills in this form. Firmware, Result and the step boxes can't be filled in
        from a link: leave them, the record at the bottom has them. Look it over, tick Privacy and press Create.

        **Everything here is public.** Leave out serial numbers, USB instance IDs, local file paths and email addresses.
  - type: dropdown
    id: firmware
    attributes:
      label: Firmware
      description: The catalog id (sent from Octo-Vave? leave it at None). Not listed? Pick "other" and name it in Notes.
      options: [official, fm1open, felucca, sloop, x0x, melodee, choralroot, fomni, ghoulbox, amb1, jangada, skiff, hortator, fm1va, aprilos, obervave, loom-8, clipper, orbit, polly, dub-1, coralflower, ctl-1, gr-mm, fmini-1, duell, frodhes, ravel, shine-on, other]
  - type: input
    id: version
    attributes:
      label: Version
      description: Exactly as the release names it.
      placeholder: v1.6.1
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File you flashed
      placeholder: felucca-1.6.1.fwsc
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA256 of that file
      description: "Windows: `certutil -hashfile FILE SHA256` · macOS/Linux: `shasum -a 256 FILE`. Octo-Vave shows it under More on the card for files in its library."
      placeholder: 64 hex digits
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - "clean (orange): install, play and revert all worked"
        - "issues (purple): all three done, but something needed a workaround"
        - "failed (red): a step failed"
  - type: checkboxes
    id: steps
    attributes:
      label: Steps completed
      options:
        - label: Installed (with the project's installer or Octo-Vave)
        - label: Ran and played it (screen, keys, knobs, sound)
        - label: Reverted to the stock version below, and stock works again
  - type: textarea
    id: checks
    attributes:
      label: What you checked
      description: Sound check results (which steps you heard), MIDI port name, anything you tried.
      placeholder: "Generic sound check: heard 1-4, 8, 10; not heard 6, 7. MIDI port 'Felucca'. Stock Run all tests 8/8 after revert."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Required for issues or failed results — what went wrong, and the workaround if there was one.
  - type: input
    id: stock
    attributes:
      label: Stock firmware before installing
      description: The stock version you installed from and reverted to (shown at boot or in M-UPGRADE). Left empty, it counts as V15.
      placeholder: V15
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report has no serial numbers, USB instance IDs, local paths or email addresses.
          required: true
  - type: textarea
    id: record
    attributes:
      label: Record from Octo-Vave
      description: Filled in by the app's Submit button (firmware, result and steps as JSON). Leave it empty when reporting by hand.
