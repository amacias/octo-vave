# Pull requests and pushes: firmware/validated.json and catalog.json must stay valid
# (schema_version, record fields, sha256 pins, no private data), and the homepage's copies
# of the card code, styles and screens must match web/ (tools/fm1_site.py --write syncs them).
name: Check firmware records

on:
  pull_request:
    paths:
      - "firmware/**"
      - "tools/**"
      - "web/fwcards.js"
      - "web/css/firmware.css"
      - "web/img/fw/**"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tools/**"
      - "web/fwcards.js"
      - "web/css/firmware.css"
      - "web/img/fw/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I tools/fm1_validate.py check
      - run: python -I tools/fm1_site.py --check
