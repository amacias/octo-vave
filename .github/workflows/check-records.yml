# Pull requests and pushes: firmware/validated.json and catalog.json must stay valid
# (schema_version, record fields, sha256 pins, no private data).
name: Check firmware records

on:
  pull_request:
    paths:
      - "firmware/**"
      - "tools/**"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I tools/fm1_validate.py check
