<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 32 33" width="320" height="330" role="img" aria-labelledby="t">
<title id="t">Octo-Vave octopus</title>
<defs>
  <!-- light from the upper left -->
  <radialGradient id="skin" gradientUnits="userSpaceOnUse" cx="12.5" cy="8" r="20">
    <stop offset="0" stop-color="#FFB27A"/>
    <stop offset=".3" stop-color="#F7883D"/>
