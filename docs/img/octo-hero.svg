    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="gs"><feFuncR type="linear" slope=".38" intercept=".74"/><feFuncG type="linear" slope=".38" intercept=".74"/><feFuncB type="linear" slope=".38" intercept=".74"/></feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency=".25 1.6" numOctaves="2" seed="8" result="s"/>
    <feColorMatrix in="s" type="saturate" values="0" result="sg"/>
    <feComponentTransfer in="sg" result="ss"><feFuncR type="linear" slope=".25" intercept=".86"/><feFuncG type="linear" slope=".25" intercept=".86"/><feFuncB type="linear" slope=".25" intercept=".86"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="gs" mode="multiply" result="a"/>
    <feBlend in="a" in2="ss" mode="multiply" result="b"/>
    <feComposite in="b" in2="SourceGraphic" operator="in"/>
  </filter>
</defs>
